spring.main.web-application-type=none
# spring.main.lazy-initialization=true
BLKDBLK.Scanner=SYSIN.bin
BLKDBLK.ScannerCharSet=cp1047
BLKDBLK.ScannerCRLFflag=no
BLKDBLK.ddname.VBSEBC=VbsFile
BLKDBLK.VbsFile=QA.QA000174.CLF.VBSEBC.FILE.CF
BLKDBLK.VbsFileCharSet=cp1047
BLKDBLK.VbsFileCRLFflag=no
BLKDBLK.ddname.UMODEASC=UmodeFile
BLKDBLK.UmodeFile=QA.QA000174.UMODEASC.FILE
BLKDBLK.UmodeFileCharSet=cp1047
BLKDBLK.UmodeFileCRLFflag=no
#logging.level.com.cloudframe=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %class{36}.%M %L - %msg%n
HIGH_VALUE=Z
