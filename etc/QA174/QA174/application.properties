#common-test-properties
spring.main.log-startup-info=OFF
# logging.pattern.file=%msg%n
logging.file.name=QA.QA000174.CLF.BLKDBLK.SYSOUT.CF
logging.logback.rollingpolicy.clean-history-on-start=true
logging.level.com.zaxxer=OFF
logging.level.com.cloudframe.app.dao.CFDataSourceConfiguration=OFF
logging.level.com.cloudframe.app.vsam.VSAMClusterUtil=OFF
logging.level.com.cloudframe.app.utility.CFConfiguration=OFF
#test-specific-properties
